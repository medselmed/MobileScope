name: Build & publier l'APK

# Le wrapper Gradle et ses propriétés se trouvent dans gradle/wrapper/.
on:
  push:
    branches: [main, pro-update]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobilescope-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compiler l'APK signé
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser le wrapper Gradle
        run: chmod +x ./gradlew

      - name: Compiler l'APK release
        shell: bash
        env:
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log

      - name: Publier le journal en cas d'échec
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/pro-update'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          grep -nE "^e: |error:|What went wrong|FAILED" build.log | head -120 > errors.txt || true
          gh release create "pro-fail-$BUILD_NUMBER" errors.txt build.log --prerelease \
            --title "Échec du build $BUILD_NUMBER" --notes "Journal de compilation." --target pro-update

      - name: Conserver l'APK compilé
        uses: actions/upload-artifact@v4
        with:
          name: MobileScope-APK-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publier la release et l'APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          gh release create "v1.0.$BUILD_NUMBER" "$APK#MobileScope-1.0.$BUILD_NUMBER.apk" \
            --title "MobileScope 1.0.$BUILD_NUMBER" \
            --notes "Compilation automatique depuis le commit $GITHUB_SHA."

      - name: Publier la pré-version (branche pro-update)
        if: github.event_name == 'push' && github.ref == 'refs/heads/pro-update'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          gh release create "pro-build-$BUILD_NUMBER" "$APK#MobileScope-1.0.$BUILD_NUMBER.apk" \
            --prerelease --target pro-update \
            --title "MobileScope 1.0.$BUILD_NUMBER (pro)" \
            --notes "Pré-version de la branche pro-update."
